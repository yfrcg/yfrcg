<svg width="1000" height="380" viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="frame"><rect width="1000" height="380" rx="18"/></clipPath>
    <radialGradient id="b1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.5" stop-color="#EDE9FE"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="ringg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gridfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridmask"><rect x="0" y="200" width="1000" height="180" fill="url(#gridfade)"/></mask>
    <filter id="fluid" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="n">
        <animate attributeName="baseFrequency" values="0.012 0.02;0.02 0.012;0.012 0.02" dur="22s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="70"/>
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="380" fill="#0B0B16"/>
    <g filter="url(#fluid)">
      <circle cx="230" cy="140" r="140" fill="url(#b1)">
        <animateTransform attributeName="transform" type="translate" values="0 0;130 70;-50 100;0 0" keyTimes="0;0.35;0.7;1" dur="17s" calcMode="spline" keySplines="0.45 0 0.2 1;0.45 0 0.2 1;0.45 0 0.2 1" repeatCount="indefinite"/>
      </circle>
      <circle cx="710" cy="230" r="160" fill="url(#b2)">
        <animateTransform attributeName="transform" type="translate" values="0 0;-110 -80;60 -120;0 0" keyTimes="0;0.4;0.75;1" dur="23s" calcMode="spline" keySplines="0.6 0 0.15 1;0.6 0 0.15 1;0.6 0 0.15 1" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="90" r="115" fill="url(#b3)">
        <animateTransform attributeName="transform" type="translate" values="0 0;90 110;-130 40;0 0" keyTimes="0;0.3;0.65;1" dur="13s" calcMode="spline" keySplines="0.5 0 0.1 1;0.5 0 0.1 1;0.5 0 0.1 1" repeatCount="indefinite"/>
      </circle>
      <circle cx="890" cy="90" r="95" fill="url(#b1)" opacity="0.65">
        <animateTransform attributeName="transform" type="translate" values="0 0;-160 90;-60 -40;0 0" keyTimes="0;0.45;0.8;1" dur="19s" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/>
      </circle>
    </g>
    <g mask="url(#gridmask)" stroke="#7C3AED" stroke-opacity="0.22" stroke-width="1">
      <line x1="500" y1="218" x2="-340" y2="380"/>
      <line x1="500" y1="218" x2="-60" y2="380"/>
      <line x1="500" y1="218" x2="180" y2="380"/>
      <line x1="500" y1="218" x2="360" y2="380"/>
      <line x1="500" y1="218" x2="500" y2="380"/>
      <line x1="500" y1="218" x2="640" y2="380"/>
      <line x1="500" y1="218" x2="820" y2="380"/>
      <line x1="500" y1="218" x2="1060" y2="380"/>
      <line x1="500" y1="218" x2="1340" y2="380"/>
      <g>
        <line x1="0" y1="248" x2="1000" y2="248"/>
        <line x1="0" y1="266" x2="1000" y2="266"/>
        <line x1="0" y1="290" x2="1000" y2="290"/>
        <line x1="0" y1="322" x2="1000" y2="322"/>
        <line x1="0" y1="362" x2="1000" y2="362"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 36" dur="5s" calcMode="spline" keySplines="0.3 0 0.7 1" keyTimes="0;1" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="translate(845 268)">
      <g>
        <ellipse rx="92" ry="24" fill="none" stroke="url(#ringg)" stroke-width="1.4" stroke-opacity="0.85"/>
        <ellipse rx="92" ry="24" fill="none" stroke="url(#ringg)" stroke-width="1" stroke-opacity="0.5" transform="rotate(60)"/>
        <ellipse rx="92" ry="24" fill="none" stroke="url(#ringg)" stroke-width="1" stroke-opacity="0.5" transform="rotate(120)"/>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="26s" repeatCount="indefinite"/>
      </g>
      <circle r="4" fill="#67E8F9">
        <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="#C4B5FD">
      <circle cx="150" cy="300" r="2" opacity="0.7">
        <animate attributeName="cy" values="300;120" dur="9s" calcMode="spline" keySplines="0.2 0 0.4 1" keyTimes="0;1" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="340" cy="330" r="1.6" opacity="0.6">
        <animate attributeName="cy" values="330;90" dur="12s" calcMode="spline" keySplines="0.3 0 0.5 1" keyTimes="0;1" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="340" r="2.2" opacity="0.5" fill="#67E8F9">
        <animate attributeName="cy" values="340;110" dur="10s" calcMode="spline" keySplines="0.25 0 0.45 1" keyTimes="0;1" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" cy="310" r="1.5" opacity="0.6">
        <animate attributeName="cy" values="310;80" dur="14s" calcMode="spline" keySplines="0.35 0 0.5 1" keyTimes="0;1" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="14s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="500" y="158" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="10" fill="url(#txt)">YUSHI WU</text>
    <text x="500" y="196" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="5" fill="#8B8FA8">AGENT INFRA · LOCAL-FIRST SYSTEMS · NLP</text>
  </g>
